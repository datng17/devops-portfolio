# Plain HTTP origin behind a Cloudflare Tunnel.
# TLS is terminated at the Cloudflare edge (automatic managed certs), so this
# vhost listens on plain HTTP only — no 443, no certificates, no redirect.
# cloudflared forwards decrypted HTTP to this server over the internal network.
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Limit concurrent connections per client
    limit_conn conn 20;

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Real client IP forwarded by Cloudflare.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS, so the original scheme is https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
