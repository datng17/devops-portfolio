# Runtime config for nginxinc/nginx-unprivileged (UID 101, port 8080).
# All writable paths live under /tmp so the container runs with a read-only root FS.

worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/manifest+json
                      image/svg+xml font/ttf font/otf;

    # Hashed assets under /static/ are immutable; everything else (index.html,
    # manifest, favicon) must be revalidated so new deploys are picked up.
    map $uri $cache_control {
        ~^/static/  "public, max-age=31536000, immutable";
        default     "no-cache";
    }

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        absolute_redirect off;

        access_log /dev/stdout main;
        # Extra log sinks (e.g. syslog to log-sink) are mounted here at runtime.
        include /etc/nginx/logging/*.conf;

        add_header Cache-Control           $cache_control;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok";
        }

        # Missing hashed assets must 404, not fall back to index.html
        location /static/ {
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
