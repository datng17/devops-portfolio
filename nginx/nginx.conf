# devops-portfolio/nginx/nginx.conf
#
# Nginx is a PLAIN HTTP origin that sits behind a Cloudflare Tunnel.
# TLS is terminated at the Cloudflare edge with automatic, managed
# certificates, so nginx no longer listens on 443, holds no certificates,
# and performs no HTTP->HTTPS redirect or ACME challenge. cloudflared
# connects to this server over the internal `frontend` Docker network and
# forwards already-decrypted HTTP. Nginx is kept for its rate limiting,
# connection limits, and security headers.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    server_tokens off;                 # hide Nginx version
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Rate limiting: 10 req/s per IP (burst configured per-location).
    # NOTE: behind Cloudflare the direct peer is cloudflared, so the real
    # client IP arrives in the CF-Connecting-IP / X-Forwarded-For headers.
    # We rate-limit on $binary_remote_addr here as a backstop; use
    # Cloudflare WAF / rate limiting rules for per-client limits at the edge.
    limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"cf_ip":"$http_cf_connecting_ip","method":"$request_method",'
        '"uri":"$uri","status":$status,"rt":$request_time,'
        '"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker embedded DNS so upstream names resolve at request time (nginx
    # starts even when the app container is momentarily down).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Plain HTTP origin (TLS handled by Cloudflare at the edge) ----
    server {
        listen 80;
        server_name _;

        # Trust Cloudflare's forwarded protocol/host so the app sees https.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        limit_conn conn 20;

        location / {
            limit_req zone=api burst=20 nodelay;
            set $upstream_app http://app:8000;
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Preserve the real client IP that Cloudflare forwards.
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Cloudflare terminates TLS, so downstream is always https.
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /health {
            set $upstream_health http://app:8000;
            proxy_pass $upstream_health/health;
            access_log off;
        }
    }
}
