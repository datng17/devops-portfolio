# devops-portfolio/nginx/nginx.conf
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    server_tokens off;                 # hide Nginx version
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Rate limiting: 10 req/s per IP (burst configured per-location)
    limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"rt":$request_time,"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker embedded DNS so upstream names resolve at request time (nginx
    # starts even when the app container is momentarily down).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Port 80: ACME challenge + health, then redirect everything else ----
    server {
        listen 80;
        server_name ${TLS_DOMAIN};

        # Let's Encrypt http-01 challenge. MUST stay on plain HTTP and must
        # NOT be redirected — certbot writes tokens here and the CA fetches
        # them over port 80.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Internal container healthcheck stays on plain HTTP so it isn't
        # bounced to HTTPS (which would fail wget and mark nginx unhealthy).
        location = /health {
            set $upstream_health http://app:8000;
            proxy_pass $upstream_health/health;
            access_log off;
        }

        # Everything else goes to HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Port 443: TLS reverse proxy ----
    server {
        listen 443 ssl;
        http2 on;
        server_name ${TLS_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${TLS_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${TLS_DOMAIN}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        limit_conn conn 20;

        location / {
            limit_req zone=api burst=20 nodelay;
            set $upstream_app http://app:8000;
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /health {
            set $upstream_health http://app:8000;
            proxy_pass $upstream_health/health;
            access_log off;
        }
    }
}
