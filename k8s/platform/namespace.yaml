apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
  labels:
    app.kubernetes.io/part-of: eks-portfolio
    # Pod Security Admission: reject anything weaker than "restricted".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    # AWS LBC injects an ALB target-health readiness gate into new pods, so a
    # rollout only proceeds once the ALB reports the new pod healthy.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
