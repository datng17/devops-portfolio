# log-sink: one Fluent Bit replica that receives Nginx access logs as syslog
# over UDP 5140 and writes them to a gp3 PVC (/data) and CloudWatch Logs
# (through the logs interface endpoint). AWS credentials come from IRSA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-sink
  namespace: portfolio
  labels:
    app.kubernetes.io/name: log-sink
  annotations:
    # Replaced from log-sink-config.env (LOG_SINK_ROLE_ARN) by kustomize.
    eks.amazonaws.com/role-arn: LOG_SINK_ROLE_ARN
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-sink-fluent-bit
  namespace: portfolio
  labels:
    app.kubernetes.io/name: log-sink
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info
      http_server: on
      http_listen: 0.0.0.0
      http_port: 2020
      health_check: on
      hc_errors_count: 5
      hc_retry_failure_count: 5
      hc_period: 60

    parsers:
      # Accepts RFC3164 lines from Nginx ("<190>Oct  1 12:00:00 host nginx: ...")
      # and bare "<pri>message" lines; anything after the header is "message".
      - name: syslog-lenient
        format: regex
        regex: '^<(?<pri>[0-9]{1,5})>(?:(?<time>[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}) (?<host>[^ ]+) (?<ident>[^:\[ ]+)(?:\[(?<pid>[0-9]+)\])?: ?)?(?<message>.*)$'
        time_key: time
        time_format: '%b %d %H:%M:%S'
        time_keep: on

    pipeline:
      inputs:
        - name: syslog
          tag: nginx
          mode: udp
          listen: 0.0.0.0
          port: 5140
          parser: syslog-lenient
          buffer_chunk_size: 32k
          buffer_max_size: 64k

      outputs:
        - name: file
          match: '*'
          path: /data
          file: nginx-access.log
          format: plain

        - name: cloudwatch_logs
          match: '*'
          region: ${CW_REGION}
          log_group_name: ${LOG_GROUP_NAME}
          log_stream_name: log-sink
          auto_create_group: false
          retry_limit: 5
---
apiVersion: v1
kind: Service
metadata:
  name: log-sink
  namespace: portfolio
  labels:
    app.kubernetes.io/name: log-sink
spec:
  # Stable ClusterIP: Nginx resolves the syslog host once at startup.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: log-sink
  ports:
    - name: syslog
      protocol: UDP
      port: 5140
      targetPort: syslog
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: log-sink
  namespace: portfolio
  labels:
    app.kubernetes.io/name: log-sink
spec:
  serviceName: log-sink
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-sink
    spec:
      serviceAccountName: log-sink
      # The IRSA webhook mounts its own projected token; no API access needed.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # makes the EBS volume writable for the non-root user
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.4@sha256:a9cc9627aeabb8bb33077ee85b6ec8c0fe40aff8e7000bb4e8cd924511fa626c
          args: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
          envFrom:
            - configMapRef:
                name: log-sink-config
          ports:
            - name: syslog
              containerPort: 5140
              protocol: UDP
            - name: http
              containerPort: 2020
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.yaml
              subPath: fluent-bit.yaml
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: log-sink-fluent-bit
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: log-sink
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
