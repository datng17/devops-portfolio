# Install to /etc/logrotate.d/devops-portfolio
/var/log/nginx/*.log {
    daily
    rotate 14
    missingok
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}

/var/log/db_backup.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
}
